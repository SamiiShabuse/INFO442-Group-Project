[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".ipynb_checkpoints",
    ".jupyter_runtime",
    ".venv",
    "data",
    "notebooks",
    "pytest_tmp",
    "reports",
    "tests/.tmp",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
"scripts/*.py" = ["E402"]
